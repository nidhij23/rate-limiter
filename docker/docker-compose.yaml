version: "3.9"

services:

  redis:
    image: redis:7
    container_name: ratelimiter-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    container_name: ratelimiter-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: ratelimiter
    volumes:
      - mongo_data:/data/db
      - ../mongo-init:/docker-entrypoint-initdb.d

  mongo-express:
    image: mongo-express:latest
    container_name: ratelimiter-mongo-ui
    restart: always
    depends_on:
      - mongo
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin   # ⭐ IMPORTANT FIX
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"

  redis-insight:
    image: redis/redisinsight:latest
    container_name: ratelimiter-redis-ui
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis_data:
  mongo_data:
